name: Lint

# This workflow carries no paths-ignore, deliberately.
#
# A check must not be able to skip the change that governs it. typos.toml,
# .markdownlint-cli2.jsonc, .prettierignore and this file all live inside the
# set these jobs scan, and in Phase 0 essentially every change is a Markdown
# change. The paths-ignore list that Phase 1's ci.yml will correctly carry,
# skipping docs/** and *.md for a set of macOS builds, would make this workflow
# green on precisely the pull requests that could fail it.
#
# Ubuntu throughout: this is platform-independent static analysis, and the
# macOS runner bills at ten times the rate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # markdownlint and Prettier, inlined rather than called.
  #
  # This should be `uses: cboone/gh-actions/.../lint-text.yml`, matching the
  # three jobs below. That workflow is unusable for any caller at v3.0.0: its
  # tool-install step reads `github.job_workflow_sha`, which arrives empty, and
  # the step is unconditional, so the job fails before a linter runs. Tracked
  # as cboone/gh-actions#83, unfixed in any release. Measured here 2026-09-08:
  # this job failed exactly that way while the three reusable calls below,
  # made the same way in the same run, all passed. None of them reads that
  # context value, which is what points at the value rather than the call.
  #
  # The workaround is the one cboone/audio-tools already uses: inline the steps
  # against a committed lockfile. That keeps the property the reusable workflow
  # was reaching for, since `npm ci` enforces per-package sha512 integrity, and
  # it makes local runs and CI agree on versions. Switch back to the reusable
  # call once a release fixes #83.
  #
  # cspell is off: typos covers the same ground, and two spell checkers means
  # two dictionaries to add every scale name to. yamllint is off as well; it is
  # not part of the Phase 0 gate and its install path reads the same
  # unpopulated context value.
  text:
    name: Text lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install lint tools
        run: npm ci --ignore-scripts --include=dev --no-audit --no-fund

      - name: Run markdownlint
        id: markdownlint
        run: npx --no-install markdownlint-cli2 "**/*.md"

      - name: Run Prettier
        if: ${{ !cancelled() }}
        id: prettier
        run: npx --no-install prettier --check .

      - name: Summarize the findings
        if: failure()
        run: |
          {
            echo "### Text lint"
            echo
            if [ "${{ steps.markdownlint.outcome }}" = "failure" ]; then
              echo '#### markdownlint'
              echo
              echo '```text'
              npx --no-install markdownlint-cli2 "**/*.md" 2>&1 || true
              echo '```'
            fi
            if [ "${{ steps.prettier.outcome }}" = "failure" ]; then
              echo '#### Prettier'
              echo
              echo '```text'
              npx --no-install prettier --list-different . 2>&1 || true
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  # Passes by finding nothing in Phase 0, which adds no shell scripts. Wired
  # now, exercised from Phase 1.
  #
  # Phase 1 hazard, recorded in AGENTS.md: this workflow discovers extensionless
  # scripts only under bin/, scripts/ and script/. The two extensionless scripts
  # Phase 1 adds under cmake/ would go unlinted, which reads exactly like
  # passing. Switch to shebang-based discovery when they land:
  #
  #   git ls-files -z | xargs -0 shfmt -f | xargs -r shellcheck
  shell:
    uses: cboone/gh-actions/.github/workflows/lint-shell.yml@91f9abd25d4f82354c0f950dfc8b6d7525b0f5b5 # v3.0.0

  actions:
    uses: cboone/gh-actions/.github/workflows/lint-github-actions.yml@91f9abd25d4f82354c0f950dfc8b6d7525b0f5b5 # v3.0.0

  # Inline because no reusable workflow covers typos: lint-text.yml offers
  # markdownlint, Prettier, cspell and yamllint, and nothing else.
  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # Pinned by version and by the tarball's SHA256, because a release asset
      # can be replaced in place under the same tag.
      TYPOS_VERSION: "1.50.1"
      TYPOS_SHA256: "edf0545109aee6a22751d04ddecb97c45be47d3aa0409564fb895eeeace91b1e"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install typos
        run: |
          cd "${RUNNER_TEMP}"
          curl -sSfL -o typos.tar.gz \
            "https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${TYPOS_SHA256}  typos.tar.gz" | sha256sum --check --strict -
          tar -xzf typos.tar.gz ./typos
          sudo install typos /usr/local/bin/typos

      - name: Report tool version
        run: typos --version

      - name: Check spelling
        id: typos
        run: typos

      - name: Summarize the findings
        if: failure() && steps.typos.outcome == 'failure'
        run: |
          {
            echo "### typos"
            echo
            echo '```text'
            typos --format brief || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
